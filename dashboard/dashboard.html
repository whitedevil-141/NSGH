<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>NSGH Admin Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <script>
      const token = sessionStorage.getItem('token');
      const expiresAt = sessionStorage.getItem('token_expiry'); // timestamp in seconds

      function redirectToLogin() {
          sessionStorage.removeItem('token');
          sessionStorage.removeItem('token_expiry');
          window.location.href = 'login.html';
      }

      if (!token || !expiresAt) {
          // No token stored
          redirectToLogin();
      } else {
          const now = Math.floor(Date.now() / 1000); // current time in seconds
          if (now >= parseInt(expiresAt)) {
              // Token expired
              redirectToLogin();
          }
      }
    </script>
  </head>
  <body class="dashboard-body">

    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>NSGH Admin Dashboard</h2>
        <button id="logoutBtn" class="btn btn-danger">Logout</button>
      </div>

      <!-- Tabs -->
      <ul class="nav nav-tabs" id="dashboardTabs" role="tablist">
        <li class="nav-item">
          <a class="nav-link active" id="doctors-tab" data-bs-toggle="tab" href="#doctors" role="tab">Doctors</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="services-tab" data-bs-toggle="tab" href="#services" role="tab">Services</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="departments-tab" data-bs-toggle="tab" href="#departments" role="tab">Departments</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="machines-tab" data-bs-toggle="tab" href="#machines" role="tab">Machines</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="gallery-tab" data-bs-toggle="tab" href="#gallery" role="tab">Gallery</a>
        </li>
      </ul>

      <div class="tab-content mt-3">
        <!-- Doctors Tab -->
        <div class="tab-pane fade show active" id="doctors" role="tabpanel">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h4>Doctors</h4>
            <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#addDoctorModal">
              Add New Doctor
            </button>
          </div>

          <hr>
          <h5>Doctors List</h5>
          <select id="doctorFilter" class="form-control mb-3 w-auto">
            <option value="all">All Categories</option>
          </select>

          <div id="doctorsContainer" class="row"></div>
          <ul id="pagination" class="pagination justify-content-center mt-3"></ul>
        </div>

        <!-- Placeholder Tabs -->
        <div class="tab-pane fade" id="services" role="tabpanel"><h4>Services Page - Placeholder</h4></div>
        <div class="tab-pane fade" id="departments" role="tabpanel"><h4>Departments Page - Placeholder</h4></div>
        <div class="tab-pane fade" id="machines" role="tabpanel"><h4>Machines Page - Placeholder</h4></div>
        <div class="tab-pane fade" id="gallery" role="tabpanel"><h4>Gallery Page - Placeholder</h4></div>
      </div>
    </div>

    <!-- Add Doctor Modal -->
    <div class="modal fade" id="addDoctorModal" tabindex="-1" aria-labelledby="addDoctorModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content p-3">
          <form id="addDoctorForm" enctype="multipart/form-data">
            <div class="modal-header border-0">
              <h5 class="modal-title" id="addDoctorModalLabel">Add New Doctor</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div class="row g-2">
                <!-- Name & Hospital -->
                <div class="col-md-6">
                  <label class="form-label small">Name</label>
                  <input class="form-control form-control-sm" name="name" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label small">Hospital</label>
                  <input class="form-control form-control-sm" name="hospital" required>
                </div>
                <!-- Room -->
                <div class="col-md-6">
                  <label class="form-label small">Room</label>
                  <input class="form-control form-control-sm" name="room" required>
                </div>
                <!-- Timing & Phone -->
                <div class="col-md-6">
                  <label class="form-label small">Timing</label>
                  <input class="form-control form-control-sm" name="timing" placeholder="e.g., Friday 6-9 PM" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label small">Phone</label>
                  <input class="form-control form-control-sm" name="phone" type="tel">
                </div>
                <!-- Description -->
                <div class="col-12">
                  <label class="form-label small">Description</label>
                  <textarea class="form-control form-control-sm" name="description" rows="2" placeholder="Optional"></textarea>
                </div>
                <!-- Specialties -->
                <div class="col-12">
                  <label class="form-label small">Specialties <small>(comma-separated)</small></label>
                  <input class="form-control form-control-sm" name="specialties" placeholder="e.g., Neurology, Pediatrics" required>
                </div>
                <!-- Qualifications -->
                <div class="col-12">
                  <label class="form-label small">Qualifications</label>
                  <div id="qualificationsContainer" class="mb-2"></div>
                  <button type="button" class="btn btn-sm btn-outline-primary" onclick="addQualificationField()">Add Qualification</button>
                </div>
                <!-- Conditions Treated -->
                <div class="col-12">
                  <label class="form-label small">Conditions Treated</label>
                  <div id="conditionsContainer" class="mb-2"></div>
                  <button type="button" class="btn btn-sm btn-outline-primary" onclick="addConditionField()">Add Condition</button>
                </div>
                <!-- Photo -->
                <div class="col-12">
                  <label class="form-label small">Photo</label>
                  <input class="form-control form-control-sm" name="photo" type="file" accept="image/*" required>
                </div>
              </div>
            </div>
            <div class="modal-footer border-0 pt-0">
              <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-success btn-sm">Add Doctor</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Edit Doctor Modal -->
    <div class="modal fade" id="editDoctorModal" tabindex="-1" aria-labelledby="editDoctorModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content p-3">
          <form id="editDoctorForm" enctype="multipart/form-data">
            <div class="modal-header border-0">
              <h5 class="modal-title" id="editDoctorModalLabel">Edit Doctor</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="editDoctorId" name="editDoctorId">

              <div class="row g-2">
                <!-- Name & Hospital -->
                <div class="col-md-6">
                  <label class="form-label small">Name</label>
                  <input type="text" class="form-control form-control-sm" id="editName" name="editName" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label small">Hospital</label>
                  <input type="text" class="form-control form-control-sm" id="editHospital" name="editHospital" required>
                </div>

                <!-- Room -->
                <div class="col-md-6">
                  <label class="form-label small">Room</label>
                  <input type="text" class="form-control form-control-sm" id="editRoom" name="editRoom" required>
                </div>

                <!-- Timing & Phone -->
                <div class="col-md-6">
                  <label class="form-label small">Timing</label>
                  <input type="text" class="form-control form-control-sm" id="editTiming" name="editTiming" placeholder="e.g., Friday 6-9 PM" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label small">Phone</label>
                  <input type="text" class="form-control form-control-sm" id="editPhone" name="editPhone">
                </div>

                <!-- Description -->
                <div class="col-12">
                  <label class="form-label small">Description</label>
                  <textarea class="form-control form-control-sm" id="editDescription" name="editDescription" rows="2" placeholder="Optional"></textarea>
                </div>
                <!-- Specialties -->
                <div class="col-md-12">
                  <label class="form-label small">Specialties <small>(comma-separated)</small></label>
                  <input type="text" class="form-control form-control-sm" id="editSpecialties" name="editSpecialties" placeholder="e.g., Neurology, Pediatrics" required>
                </div>

                <!-- Qualifications -->
                <div class="col-12">
                  <label class="form-label small">Qualifications</label>
                  <div id="editQualificationsContainer" class="mb-2"></div>
                  <button type="button" class="btn btn-sm btn-outline-primary" onclick="addQualificationField('editQualificationsContainer')">Add Qualification</button>
                </div>

                <!-- Conditions Treated -->
                <div class="col-12">
                  <label class="form-label small">Conditions Treated</label>
                  <div id="editConditionsContainer" class="mb-2"></div>
                  <button type="button" class="btn btn-sm btn-outline-primary" onclick="addConditionField('editConditionsContainer')">Add Condition</button>
                </div>

                <!-- Photo -->
                <div class="col-12">
                  <label class="form-label small">Photo</label>
                  <input type="file" class="form-control form-control-sm" id="editPhoto" name="editPhoto" accept="image/*">
                </div>
              </div>
            </div>
            <div class="modal-footer border-0 pt-0">
              <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary btn-sm">Update Doctor</button>
            </div>
          </form>
        </div>
      </div>
    </div>


    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
